  <body class="bg-[#070b14] text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-300">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #070b14; color: #f1f5f9; font-family: sans-serif; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 3px solid #0891b2; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h1 style="font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #38bdf8;">【Study DRILL Makers】</h1>
        <p style="font-size: 13px; color: #94a3b8;">学習エンジン起動中...（文部科学省指導要領準拠）</p>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('学習エンジン起動中') !== -1)) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #070b14; color: #f1f5f9; font-family: sans-serif; text-align: center; padding: 20px;"><div style="color: #f43f5e; font-size: 20px; font-weight: bold; margin-bottom: 8px;">⚠️ 画面の読み込み待機中</div><p style="font-size: 13px; color: #94a3b8; max-width: 360px; line-height: 1.6; margin-bottom: 16px;">サーバー接続を確立しています。数秒後に自動反映されるか、下のボタンを押してください。</p><button onclick="window.location.reload()" style="background-color: #0891b2; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">再読み込み</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
